name: Push alerts
# Browser push alerts (scripts/send-push.mts): new episodes every hour from the airing snapshot, and character
# birthdays at 03:30 UTC (9 AM in India). Each alert is sent once (push_sent in MongoDB). Until the
# VAPID_PRIVATE_KEY secret and data/vapid.json exist, the script logs a notice and does nothing.
on:
  schedule:
    - cron: "41 * * * *"
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: What to send
        type: choice
        options: [episodes, birthdays]
        default: episodes
permissions:
  contents: read
concurrency: push-alerts
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send alerts
        run: npx tsx scripts/send-push.mts "${{ inputs.mode || (github.event.schedule == '30 3 * * *' && 'birthdays') || 'episodes' }}"
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
