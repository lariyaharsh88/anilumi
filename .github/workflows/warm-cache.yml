name: Warm cache
# Builds every sitemap page through anilumi.in (scripts/warm-cache.mjs) so visitors and Google get cached pages,
# never a first-time render. Each app deploy starts a fresh page cache: `npm run deploy` (run by
# .github/workflows/deploy.yml on every push to main) triggers this when it finishes. Every 6 hours as well, for pages whose cache expired.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
concurrency:
  group: warm-cache
  cancel-in-progress: true # a newer deploy supersedes a pass that is still running
jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Warm every page
        run: CONC=3 GAP=1 node scripts/warm-cache.mjs https://anilumi.in
