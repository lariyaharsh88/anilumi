name: Warm cache after deploy
# Render empties the page cache on every deploy, so the first visit to each page renders from scratch (2-7 s).
# Wait for this commit to go live, then load the 500 most important pages one by one (see scripts/warm-cache.mjs).
# Manual only: Render's free plan includes 5 GB of bandwidth a month, and warming 500 pages after every push
# used a large share of it (the workspace was suspended on 31 Oct 2026 at 9.3 GB).
on:
  workflow_dispatch:
concurrency:
  group: warm-cache
  cancel-in-progress: true
jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the deploy of this commit
        id: wait
        run: |
          for i in $(seq 1 60); do
            live=$(curl -s -m 20 https://anilumi.in/api/version | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).commit||'')}catch{console.log('')}})")
            if [ "$live" = "$GITHUB_SHA" ]; then echo "live=1" >> "$GITHUB_OUTPUT"; echo "Deployed."; exit 0; fi
            sleep 20
          done
          echo "::warning::Commit not live after 20 minutes; skipping warm-up."
      - name: Warm the top pages
        if: steps.wait.outputs.live == '1'
        run: LIMIT=100 node scripts/warm-cache.mjs https://anilumi.in
