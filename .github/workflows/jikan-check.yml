name: Jikan enrichment check
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Space-separated Kitsu slugs (blank = top airing shows)"
        required: false
        default: ""
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/check-jikan.ts ${{ inputs.slugs }}
        env:
          JIKAN_ENRICH: "1"
