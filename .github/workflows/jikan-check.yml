name: Jikan enrichment check
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Space-separated Kitsu slugs (blank = top airing shows)"
        required: false
        default: ""
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Raw probe
        run: |
          for u in "https://api.jikan.moe/v4" "https://api.jikan.moe/v4/anime/21/episodes?page=1"; do
            rm -f /tmp/body
            curl -sS -m 30 -o /tmp/body -w "%{http_code} %{time_total}s $u\n" "$u" || echo "unreachable: $u"
            [ -f /tmp/body ] && head -c 300 /tmp/body && echo
          done
        continue-on-error: true
      - run: npx tsx scripts/check-jikan.ts ${{ inputs.slugs }}
        env:
          JIKAN_ENRICH: "1"
          JIKAN_DEBUG: "1"
          JIKAN_TIMEOUT_MS: "15000"
