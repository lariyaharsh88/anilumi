name: Sitemap
# Tells search engines about https://anilumi.in/sitemap.xml (scripts/submit-sitemap.mts): Google through the Search
# Console API (needs the secret GSC_SERVICE_ACCOUNT), and Bing and others through IndexNow (changed URLs only).
# Daily, and after each deploy once the new build is live (after-deploy.yml).
# The edge Worker's Cloudflare cron also starts this on time (edge/schedule.js); the schedule below is the backup.
# IndexNow's log of URLs sent in the last 72 hours lives in actions/cache: each run restores the newest copy
# (restore-keys prefix) and saves its own under a new key, even when the run fails, so no URL is sent twice.
# Every start (cron, edge Worker, after-deploy) runs on main, so they all share one cache scope.
on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC (11:47 IST)
  workflow_dispatch:
permissions:
  contents: read
concurrency: sitemap
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # IndexNow pauses 90 s between groups of URLs (up to 6 minutes)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/indexnow-sent.json
          key: indexnow-sent-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-sent-
      - run: npx tsx scripts/submit-sitemap.mts
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          INDEXNOW_SENT_LOG: ${{ runner.temp }}/indexnow-sent.json
      - uses: actions/cache/save@v4
        if: always() # a missing log (the sitemap couldn't be read) is only a warning
        with:
          path: ${{ runner.temp }}/indexnow-sent.json
          key: indexnow-sent-${{ github.run_id }}-${{ github.run_attempt }}
