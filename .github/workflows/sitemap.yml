name: Sitemap
# Tells search engines about https://anilumi.in/sitemap.xml (scripts/submit-sitemap.mts): Google through the Search
# Console API (needs the secret GSC_SERVICE_ACCOUNT), and Bing and others through IndexNow (changed URLs only).
# Daily, and after each deploy once the new build is live (after-deploy.yml).
# The edge Worker's Cloudflare cron also starts this on time (edge/schedule.js); the schedule below is the backup.
on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC (11:47 IST)
  workflow_dispatch:
permissions:
  contents: read
concurrency: sitemap
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/submit-sitemap.mts
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
