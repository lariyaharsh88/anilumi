name: Alerts
# Episode and birthday alerts by browser push and email, and the Friday digest (scripts/send-alerts.mts).
# GitHub runs schedules late or skips them (an hourly cron ran 3-7 hours apart in Nov 2026), so every run is
# "auto": new episodes from the last 12 hours, plus character birthdays once it's 03:30 UTC (9 AM in India) and
# the weekly digest from Friday 03:30 UTC until it has gone out. Each alert is sent once (alerts_sent in
# MongoDB). A channel whose secret (VAPID_PRIVATE_KEY, RESEND_API_KEY) is missing is skipped with a notice.
# The edge Worker's Cloudflare cron also starts this on time (edge/schedule.js); the schedule below is the backup.
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: What to send
        type: choice
        options: [auto, episodes, birthdays, digest, confirm-pending]
        default: auto
permissions:
  contents: read
concurrency: alerts
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send
        run: npx tsx scripts/send-alerts.mts "${{ inputs.mode || 'auto' }}"
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
