name: Deploy to Cloudflare
# Every push to main ships the app Worker "anilumi" (OpenNext), then `npm run deploy` starts the cache warm-up.
# Commits tagged [skip render] or [skip deploy] (edge-only or docs changes) don't deploy. The edge Worker
# (edge/wrangler.toml) is still deployed by hand. Needs repo secrets CLOUDFLARE_API_TOKEN (Workers Scripts,
# Workers R2 Storage and Account Settings: Edit) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false # let a running deploy finish; the next push queues behind it
permissions:
  contents: read
  actions: write # gh workflow run warm-cache.yml
jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[skip render]') && !contains(github.event.head_commit.message, '[skip deploy]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
      - name: Check the live build
        run: |
          want=$(git rev-parse HEAD)
          for i in $(seq 1 30); do
            live=$(curl -s --max-time 20 https://anilumi.in/api/version | grep -o '"commit":"[0-9a-f]*"' | cut -d'"' -f4)
            [ "$live" = "$want" ] && { echo "anilumi.in is on $want"; exit 0; }
            sleep 20
          done
          echo "::error::anilumi.in still reports ${live:-nothing}, expected $want"; exit 1
