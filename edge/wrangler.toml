# Edge cache in front of the app (see worker.js). Deploy: npx wrangler deploy --config edge/wrangler.toml
# With the APP service binding below, the origin is the "anilumi" Worker (Cloudflare Workers); remove it to fall
# back to Render.
name = "anilumi-edge"
main = "worker.js"
compatibility_date = "2026-10-19"
workers_dev = false
services = [{ binding = "APP", service = "anilumi" }]
routes = [
  { pattern = "anilumi.in/*", zone_name = "anilumi.in" },
  { pattern = "www.anilumi.in/*", zone_name = "anilumi.in" },
]
# Starts the GitHub workflows on time (edge/schedule.js), since GitHub's own schedules run hours late. Needs the
# secret GH_DISPATCH_TOKEN: npx wrangler secret put GH_DISPATCH_TOKEN --config edge/wrangler.toml
[triggers]
crons = ["5,35 * * * *"]

# Global page cache (see worker.js): shares the app's bucket under edge/. Old builds' copies are never read again;
# a lifecycle rule clears them: npx wrangler r2 bucket lifecycle add anilumi-next-cache edge-expiry edge/ --expire-days 30
[[r2_buckets]]
binding = "PAGES"
bucket_name = "anilumi-next-cache"
